name: Playwright Tests
on:
  pull_request:
    branches: [ main, master ]
  schedule:
    - cron: '00 02 * * *' # UTC time
  workflow_dispatch:       # Allows manual trigger from GitHub UI
permissions:
  contents: read
jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-24.04
    # The job's steps run INSIDE this image.
    # The tag must match the @playwright/test version in package.json.
    container:
      image: mcr.microsoft.com/playwright:v1.58.2-noble # must match @playwright/test
      options: --ipc=host   # avoids Chromium running out of shared memory
    env:
      BASE_URL: ${{ secrets.PRODUCTION_URL }}   # applies to ALL steps in this job
    strategy:
      fail-fast: false  # one failing shard must not cancel the others
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v7
      - name: Install dependencies
        run: npm ci
      - name: Run shard ${{ matrix.shard }}/4
        run: npx playwright test --shard=${{ matrix.shard }}/4
      # Playwright blob report (merged into one HTML report later)
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: blob-report-${{ matrix.shard }}
          path: blob-report
          if-no-files-found: error
          retention-days: 7
      # Raw Allure results from this shard (combined into one report later)
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: allure-results-${{ matrix.shard }}
          path: allure-results
          if-no-files-found: error
          retention-days: 7

  # ------ Merge the reports -------
  merge-reports:
    if: ${{ !cancelled() }}
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24   # pinned: "lts/*" now resolves to Node 26
          cache: npm
      # allure-commandline (Allure 2) needs Java to build the report
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - run: npm ci

      # ---- Playwright HTML report ----
      - uses: actions/download-artifact@v8
        with:
          path: all-blob-reports
          pattern: blob-report-*
          merge-multiple: true
      - name: Verify downloaded blob reports
        run: ls -R all-blob-reports
      - name: Merge Playwright reports
        run: npx playwright merge-reports --reporter html,json,junit ./all-blob-reports
      - uses: actions/upload-artifact@v7
        with:
          name: html-report
          path: playwright-report
          if-no-files-found: error
          retention-days: 14

      # ---- Allure report: runs even if the HTML steps above failed ----
      - uses: actions/download-artifact@v8
        if: ${{ !cancelled() }}
        with:
          path: allure-results
          pattern: allure-results-*
          merge-multiple: true
      - name: Generate Allure report
        if: ${{ !cancelled() }}
        run: npx allure generate allure-results --clean -o allure-report
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: allure-report
          path: allure-report
          if-no-files-found: error
          retention-days: 14

      # ---- Send Email ----
      - name: Send email on failure
        if: ${{ !cancelled() && needs.test.result == 'failure' }}
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          subject: "Tests Failed - ${{ github.workflow }}"
          to: "rohit18mudliar@gmail.com"
          from: "CI Bot"
          body: "Playwright tests failed. Check: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"