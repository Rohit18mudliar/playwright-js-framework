name: Playwright Tests
on: 
  pull_request:
    branches: [ main, master ]
  schedule:
    - cron: '00 17 * * *'   # 17:00 IST every day
      timezone: 'Asia/Kolkata'  
  workflow_dispatch:       # Allows manual trigger from GitHub UI
permissions:
  contents: read
jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-24.04
    # The job's steps run INSIDE this image.
    # The tag must match the @playwright/test version in package.json.
    container:
      image: mcr.microsoft.com/playwright:v1.58.2-noble
      options: --ipc=host   # avoids Chromium running out of shared memory
    env:
        BASE_URL: ${{ secrets.PRODUCTION_URL }}   # applies to ALL steps in this job
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
    - uses: actions/checkout@v7
    - name: Install dependencies
      run: npm ci 
    - name: Run shard ${{ matrix.shard }}/4
      run: npx playwright test --shard=${{ matrix.shard }}/4
    - uses: actions/upload-artifact@v7
      if: ${{ !cancelled() }}
      with:
        name: blob-report-${{ matrix.shard }}
        path: blob-report
        if-no-files-found: error
        retention-days: 7         
  merge-reports:
    if: ${{ !cancelled() }}
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v8
        with:
          path: all-blob-reports
          pattern: blob-report-*
          merge-multiple: true
      - run: npx playwright merge-reports --reporter html ./all-blob-reports
      - uses: actions/upload-artifact@v7
        with:
          name: html-report
          path: playwright-report
          retention-days: 14  
      - name: Send email on failure
        if: ${{ needs.test.result == 'failure' }}
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          subject: "Tests Failed - ${{ github.workflow }}"
          to: "rohit18mudliar@gmail.com"
          from: "CI Bot"
          body: "Playwright tests failed. Check: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
      
      
     
