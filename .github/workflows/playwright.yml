name: Playwright Tests
on:
  # push:
  #   branches: [ main, master ]
  # pull_request:
  #   branches: [ main, master ]
  # schedule:
  #   - cron: '*/5 * * * *'   
  workflow_dispatch:        # also allows manual trigger from GitHub UI
jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    env:
        BASE_URL: ${{ secrets.PRODUCTION_URL }}   # ✅ applies to ALL steps in this job
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-node@v7
      with:
        node-version: lts/*     
    - name: Install dependencies
      run: npm ci
    - name: Install Playwright Browsers
      # run: npx playwright install --with-deps
      run: npx playwright install chromium     
    - name: Run Playwright tests
      # run: npm run DataDrivenTest
      run: npx playwright test --grep @Smoke
    - uses: actions/upload-artifact@v7
      if: ${{ !cancelled() }}
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30
    - name: Send email on failure
      if: failure()
      uses: dawidd6/action-send-mail@v3
      with:
        server_address: smtp.gmail.com
        server_port: 465
        username: ${{ secrets.EMAIL_USERNAME }}
        password: ${{ secrets.EMAIL_PASSWORD }}
        subject: "Tests Failed - ${{ github.workflow }}"
        to: "rohit18mudliar@gmail.com"
        from: "CI Bot"
        body: "Playwright tests failed. Check: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
    
    
     
