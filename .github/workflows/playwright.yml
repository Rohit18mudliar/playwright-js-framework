name: Playwright Tests
on: 
  pull_request:
    branches: [ main, master ]
  schedule:
    - cron: '30 05 * * *'   # 05:30 IST every day
      timezone: 'Asia/Kolkata'  
  workflow_dispatch:       # Allows manual trigger from GitHub UI
jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    env:
        BASE_URL: ${{ secrets.PRODUCTION_URL }}   # applies to ALL steps in this job
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-node@v7
      with:
        node-version: lts/*     
    - name: Install dependencies
      run: npm ci
    - name: Install Playwright Browsers
      run: npx playwright install --with-deps    
    - name: Run shard ${{ matrix.shard }}/4
      run: npx playwright test --shard=${{ matrix.shard }}/4
    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: blob-report-${{ matrix.shard }}
        path: blob-report
        retention-days: 7          
  merge-reports:
    if: ${{ !cancelled() }}
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          path: all-blob-reports
          pattern: blob-report-*
          merge-multiple: true
      - run: npx playwright merge-reports --reporter html ./all-blob-reports
      - uses: actions/upload-artifact@v4
        with:
          name: html-report
          path: playwright-report
          retention-days: 14  
      - name: Send email on failure
        if: failure()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          subject: "Tests Failed - ${{ github.workflow }}"
          to: "rohit18mudliar@gmail.com"
          from: "CI Bot"
          body: "Playwright tests failed. Check: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
      
      
     
